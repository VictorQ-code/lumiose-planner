<!DOCTYPE html>
<html lang="es">
<head>

<title>Lumiose Planner · Barcelona</title>
<meta name="description" content="Lumiose Planner: Barcelona en 3D en el navegador, con tráfico, Bicing, buses, metro y tiempo en vivo. · Barcelona in 3D in the browser, with live traffic, bike share, buses, metro and weather.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23efe1c2'/%3E%3Cpath d='M3 21h18M5 21V10l4-3v14M9 21V4h6v17M15 21V9h4v12' fill='none' stroke='%233a2616' stroke-width='1.8'/%3E%3C/svg%3E">
<script>
// Idioma, como en victorquero.dev: ?lang=en|es en la dirección > lo elegido antes > el idioma del navegador.
// T('texto', 'text') devuelve el del idioma activo; setLang() lo cambia al momento y avisa con el evento «idioma».
(function(){
  var d=document.documentElement, l;
  try{ l=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(l!=='es'&&l!=='en'){ try{ l=localStorage.getItem('idioma'); }catch(e){} }
  if(l!=='es'&&l!=='en') l=/^(es|ca|gl|eu)\b/i.test(navigator.language||'')?'es':'en';
  window.LANG=l; d.lang=l; d.setAttribute('data-lang',l);
  window.T=function(es,en){ return window.LANG==='en'?en:es; };
  window.NUM=function(n,dec){ return Number(n).toLocaleString(window.LANG==='en'?'en-GB':'es-ES',dec==null?undefined:{maximumFractionDigits:dec}); };
  window.setLang=function(x){ if(x!=='es'&&x!=='en'||x===window.LANG) return; window.LANG=x; d.lang=x; d.setAttribute('data-lang',x);
    try{ localStorage.setItem('idioma',x); }catch(e){} window.dispatchEvent(new CustomEvent('idioma',{detail:x})); };
  // Móvil o tablet (pantalla táctil como principal; el iPad se presenta como Mac): menos memoria y otra interfaz
  window.MOVIL=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform||''));
  // En casa (este PC o la red local) se ve también el test de rendimiento; en la web pública, no
  window.LOCAL=/^(localhost|127\.|\[?::1\]?$|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)||location.protocol==='file:';
  if(window.MOVIL) d.classList.add('tactil');
  // Incrustado en la pestaña del portfolio (iframe): sin enlace de vuelta, y la página de fuera puede cambiar el idioma
  try{ window.EMBED=window.top!==window.self; }catch(e){ window.EMBED=true; }
  if(window.EMBED) d.classList.add('embed');
  window.addEventListener('message',function(e){
    if(!/^https:\/\/(www\.)?victorquero\.dev$|^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(e.origin)) return;   // solo la web de Victor (y pruebas en casa)
    if(e.data&&e.data.tipo==='lumiose-idioma') window.setLang(e.data.lang);
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3a2616;--muted:#6b5440;--card:rgba(243,232,208,.95);--line:rgba(58,38,22,.28)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"EB Garamond",Georgia,serif;color:var(--ink);background:#efe1c2}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 18px rgba(58,38,22,.18)}
  header{position:fixed;top:14px;left:16px;padding:10px 14px;max-width:440px}
  h1{margin:0;font-family:"IM Fell English",serif;font-weight:400;font-size:24px}
  #stats{margin:4px 0 6px;font-size:14px;color:var(--muted);line-height:1.4}
  select{font:inherit;font-size:15px;color:var(--ink);background:#f6ecd6;border:1px solid var(--line);border-radius:3px;padding:3px 6px;max-width:100%}
  .tools{position:fixed;top:14px;right:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
  button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:3px;cursor:pointer;box-shadow:0 2px 8px rgba(58,38,22,.15)}
  button[aria-pressed="true"]{background:var(--ink);color:#f3e8d0;border-color:var(--ink)}
  #tip{position:fixed;pointer-events:none;padding:8px 11px;font-size:14px;line-height:1.35;display:none;max-width:280px;z-index:3}
  #tip b{font-family:"IM Fell English",serif;font-weight:400;font-size:16px}
  #mini{position:fixed;left:16px;bottom:16px;width:220px;height:220px;cursor:crosshair;padding:0}
  #help{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  #legend{position:fixed;left:16px;bottom:250px;padding:8px 12px;font-size:14px;display:none;max-height:45vh;overflow:auto}
  #legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
  #legend i{width:22px;height:6px;border-radius:3px;display:inline-block}
  #legend small{display:block;color:var(--muted);margin-top:4px;max-width:230px}
  #legend .lg-cab{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:14px;width:100%;font-family:"IM Fell English",serif;font-size:16px;padding:2px 0}
  #legend .lg-cab span{color:var(--muted)}
  #legend.plegada .lg-cuerpo{display:none}
  #legend.plegada{max-height:none;overflow:visible}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .st{position:absolute;transform:translate(-50%,-120%);font-family:"IM Fell English",serif;font-style:italic;font-size:13px;white-space:nowrap;
      color:var(--ink);background:rgba(243,232,208,.85);padding:0 4px;border-radius:2px}
  .bl{position:absolute;transform:translate(-50%,-50%);font-family:"IM Fell English",serif;font-size:15px;white-space:nowrap;color:var(--ink);
      text-shadow:0 0 3px #f3e7cc,0 0 3px #f3e7cc,0 0 6px #f3e7cc;letter-spacing:.02em}
  .lm{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;font-family:"IM Fell English",serif;
      font-size:15px;color:#8f2f1c;background:rgba(246,236,214,.92);border:1px solid rgba(143,47,28,.45);border-radius:3px;padding:1px 6px 1px 5px;
      box-shadow:0 2px 6px rgba(58,38,22,.18)}
  .lm::after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:rgba(143,47,28,.6)}
  .lm.sq{color:var(--ink);border-color:var(--line);font-style:italic}
  #src{position:fixed;right:16px;bottom:12px;font-size:12px;color:var(--muted);max-width:50%;text-align:right}
  #fps{position:fixed;right:16px;bottom:30px;font-size:12px;color:var(--muted)}
  #stream{position:fixed;right:16px;bottom:48px;font-size:12px;color:var(--muted)}
  #warn{position:fixed;left:50%;transform:translateX(-50%);top:14px;padding:6px 12px;font-size:14px;display:none}
  #benchBox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;display:none;z-index:6;max-width:94vw;max-height:88vh;overflow:auto;font-size:14px}
  #benchBox table{border-collapse:collapse;margin:8px 0} #benchBox td,#benchBox th{padding:3px 10px;border-bottom:1px solid var(--line);text-align:right}
  #benchBox td:first-child,#benchBox th:first-child{text-align:left} #benchBox h2{font-family:"IM Fell English",serif;font-weight:400;margin:0 0 4px}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#efe1c2;z-index:5;transition:opacity .5s}
  #load .box{width:min(460px,86vw);text-align:center}
  #load h2{font-family:"IM Fell English",serif;font-weight:400;font-size:26px;margin:0 0 12px}
  #bar{height:4px;background:rgba(58,38,22,.15);border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
  #msg{margin-top:10px;font-size:15px;color:var(--muted);white-space:pre-line}
  button,select,.lm{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .ico{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .solo-movil,#hdrTog{display:none}
  #bLang{font-variant:small-caps;letter-spacing:.04em}
  #srcm{display:none}
  #marca{margin:2px 0 0;font-size:13px;color:var(--muted);letter-spacing:.02em} #marca b{font-weight:500;color:var(--ink)} #marca a{color:var(--muted)}
  html.embed #marca{display:none}
  #wheelHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 14px;font-size:15px;display:none;z-index:4;pointer-events:none}
  /* Tablet (táctil y pantalla grande): misma distribución que en el ordenador, con botones a la medida del dedo */
  html.tactil .tools button{min-height:42px;padding:6px 14px;font-size:16px}
  html.tactil select{font-size:16px;padding:6px}
  html.tactil #mini{width:180px;height:180px}
  /* ---- Teléfono (vertical u horizontal): el mapa a pantalla completa y todo lo demás recogido ---- */
  @media (max-width:720px),(max-height:520px){
    header{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:auto;padding:5px 6px 5px 12px;
      max-width:calc(100vw - 86px - env(safe-area-inset-left) - env(safe-area-inset-right));max-height:calc(100vh - 24px);overflow:auto;-webkit-overflow-scrolling:touch}
    header .top{display:flex;align-items:center;gap:6px}
    h1{font-size:20px;cursor:pointer}
    #hdrTog{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;box-shadow:none;border-color:transparent;background:transparent;font-size:18px}
    header .hdr-body{display:none;padding:2px 6px 4px 0} header.abierto .hdr-body{display:block}
    header.abierto #hdrTog{transform:rotate(180deg)}
    #stats{font-size:14px} select{font-size:16px;width:100%;padding:6px}
    #help{display:block;font-size:13px} #srcm{display:block;font-size:11.5px;color:var(--muted);margin:6px 0 0}
    .tools{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));bottom:auto;left:auto;flex-direction:column;flex-wrap:nowrap;
      gap:8px;max-width:none;max-height:calc(100vh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;overflow-x:visible;padding:2px;-webkit-overflow-scrolling:touch}
    .tools button{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .tools .lbl{display:none} .tools .ico{display:block}
    .tools #bLang .lbl{display:inline;font-size:15px}
    .solo-movil{display:inline-flex}
    #mini{display:none;width:150px;height:150px;left:calc(8px + env(safe-area-inset-left));bottom:calc(8px + env(safe-area-inset-bottom))}
    body.mini-on #mini{display:block}
    #legend{left:calc(8px + env(safe-area-inset-left));bottom:auto;top:calc(64px + env(safe-area-inset-top));max-height:38vh;font-size:13px;padding:6px 10px}
    #src,#fps,#stream{display:none}
    #tip{max-width:calc(100vw - 24px);font-size:15px}
    .lm{font-size:13px} .bl{font-size:13px}
    #warn{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));max-width:90vw}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header class="card" id="hdr"><div class="top"><h1 id="title" data-en="Loading…">Cargando…</h1><button id="hdrTog" aria-expanded="false" data-en-label="Show details" aria-label="Mostrar detalles">▾</button></div>
  <div class="hdr-body"><p id="marca"><b>Lumiose Planner</b> · <a href="https://victorquero.dev/proyectos/lumiose-planner/" target="_top" data-en="by Victor Quero">de Victor Quero</a></p><p id="stats"></p><select id="go" style="display:none"></select><p id="help"></p><p id="srcm"></p></div></header>
<canvas id="mini" class="card" width="440" height="440"></canvas>
<div class="tools" id="tools">
  <button id="bCity" aria-pressed="true" data-en-label="City" aria-label="Ciudad" title="Ciudad"><svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l4-3v14M9 21V4h6v17M15 21V9h4v12M11.5 8h1M11.5 11h1M11.5 14h1"/></svg><span class="lbl" data-en="City">Ciudad</span></button>
  <button id="bUnder" aria-pressed="false" data-en-label="Underground" aria-label="Subsuelo" title="Subsuelo"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h18M5 7l2 3M19 7l-2 3"/><rect x="6" y="12" width="12" height="7" rx="3"/><path d="M9 19l-1.5 2M15 19l1.5 2M9 15.5h.01M15 15.5h.01"/></svg><span class="lbl" data-en="Underground">Subsuelo</span></button>
  <button id="bRot" aria-pressed="false" data-en-label="Spin" aria-label="Girar" title="Girar"><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg><span class="lbl" data-en="Spin">Girar</span></button>
  <button id="bHome" data-en-label="Fit the city" aria-label="Encuadrar" title="Encuadrar"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl" data-en="Fit view">Encuadrar</span></button>
  <button id="bLive" class="solo-movil" aria-pressed="false" data-en-label="Live data" aria-label="En vivo" title="En vivo"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span class="lbl" data-en="Live">En vivo</span></button>
  <button id="bMini" class="solo-movil" aria-pressed="false" data-en-label="Mini map" aria-label="Minimapa" title="Minimapa"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg><span class="lbl" data-en="Map">Mapa</span></button>
  <button id="bLang" data-en-label="Ver en español" aria-label="View in English" title="View in English"><span class="lbl">EN</span></button>
  <button id="bBench" data-en-label="Performance test" aria-label="Test de rendimiento"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20a8 8 0 1 1 16 0M12 20l4-6"/></svg><span class="lbl" data-en="Performance test">Test de rendimiento</span></button>
</div>
<div id="warn" class="card"></div>
<div id="wheelHint" class="card" data-en="Click the map to zoom with the wheel">Haz clic en el mapa para hacer zoom con la rueda</div>
<div id="tip" class="card"></div>
<div id="legend" class="card"></div>
<div id="stream"></div>
<div id="fps"></div>
<div id="benchBox" class="card"></div>
<div id="src"></div>
<div id="load"><div class="box"><h2>Lumiose Planner</h2><p style="margin:-6px 0 12px;color:var(--muted)" data-en="Drawing Barcelona…">Dibujando Barcelona…</p><div id="bar"><i></i></div><div id="msg"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
let PASO='inicio'; const T0=performance.now(), MARKS=[];
function paso(n){ MARKS.push([PASO,performance.now()-T0]); PASO=n; }
function mostrarError(err){
  // Con la ciudad ya en pantalla, un fallo suelto (una tesela, un dato en vivo, un gesto raro) no tapa la vista: solo se anota
  if(window.__visorListo){ console.error('Lumiose Planner:',err); return; }
  const m=document.getElementById('msg'), bar=document.getElementById('bar');
  if(bar) bar.style.display='none';
  if(m) m.textContent=T('Error en el paso "','Error at step "')+PASO+'":\n'+(err&&err.message?err.message:err)+(err&&err.stack?'\n\n'+String(err.stack).split('\n').slice(0,4).join('\n'):'');
  const l=document.getElementById('load'); if(l){ l.style.display='grid'; l.style.opacity=1; }
}
window.addEventListener('error',e=>mostrarError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>mostrarError(e.reason));

(async function(){
const $=id=>document.getElementById(id);
const fail=t=>{ $('msg').textContent=t; $('bar').style.display='none'; };
// Textos fijos de la página: el español va en el HTML; el inglés, en data-en (texto) y data-en-label (aria-label y title)
function applyLang(){
  for(const el of document.querySelectorAll('[data-en]')){ if(el.dataset.es===undefined) el.dataset.es=el.textContent; el.textContent=LANG==='en'?el.dataset.en:el.dataset.es; }
  for(const el of document.querySelectorAll('[data-en-label]')){ if(el.dataset.esLabel===undefined) el.dataset.esLabel=el.getAttribute('aria-label')||'';
    const v=LANG==='en'?el.dataset.enLabel:el.dataset.esLabel; el.setAttribute('aria-label',v); if(el.hasAttribute('title')) el.title=v; }
  const bl=$('bLang'); if(bl){ bl.firstElementChild.textContent=LANG==='en'?'ES':'EN'; }
  $('help').textContent=MOVIL?T('Un dedo: mover · dos dedos: zoom, girar e inclinar · toca un edificio: su ficha · doble toque: ir ahí',
                                'One finger: move · two fingers: zoom, turn and tilt · tap a building: its details · double tap: go there')
                             :T('Arrastrar: mover · botón derecho: girar · rueda: zoom · doble clic: ir ahí · WASD/flechas: mover · Q/E: girar',
                                'Drag: move · right button: turn · wheel: zoom · double click: go there · WASD/arrows: move · Q/E: turn');
}
applyLang();
$('bLang').onclick=()=>setLang(LANG==='en'?'es':'en');
if(!LOCAL) $('bBench').style.display='none';                     // el test de rendimiento solo en casa
$('hdrTog').onclick=$('title').onclick=()=>{ if(getComputedStyle($('hdrTog')).display==='none') return;
  const h=$('hdr'), on=!h.classList.contains('abierto'); h.classList.toggle('abierto',on); $('hdrTog').setAttribute('aria-expanded',String(on)); };
if(!window.THREE||!THREE.OrbitControls||!THREE.BufferGeometryUtils){ fail(T('No se ha podido cargar Three.js (¿sin conexión a internet?).','Three.js could not be loaded (no internet connection?).')); return; }

/* ================= Estilo: tinta sepia retocada ================= */
const PAPER=0xefe1c2, INK=new THREE.Color(0x4b2e1a);
const LDIR=new THREE.Vector3(-0.35,0.8,0.55).normalize();
const STYLE={
  WASH:{residential:0xf6ebd2,office:0xeee6d3,retail:0xf2dcb4,publicServices:0xe8e6c6,industrial:0xe2d6bf},
  WASH_DEF:0xf4e7cb, LM_WALL:0xeab394, LM_ROOF:0xc9674a, ROOF:{cuerpo:0xe0bc8e,torre:0xd9b083,bajos:0xeadbbd,manzana:0xe0bc8e}, ROOF_DEF:0xe0bc8e, BASEMENT:0xdcc49c,
  L:[LDIR.x,LDIR.y,LDIR.z]
};
const PLINTH=0xc4ab82, STREET=0xece0c4;   // STREET = acera / suelo urbano
const OUTLINE_PX=2.4, HATCH_PX=6.5;
const NEAR_MPP=1.6;        // metros por píxel por debajo de los cuales se carga el detalle por edificio
const MAX_READY=MOVIL?(navigator.deviceMemory&&navigator.deviceMemory<=3?110:150):260;   // teselas de detalle en memoria (el móvil tiene menos)
const MAX_INFLIGHT=4;

/* ================= Índice ================= */
const params=new URLSearchParams(location.search);
async function getJSON(url){ const r=await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error(`${r.status} al pedir ${url}`); return r.json(); }
let BARRIO=params.get('barrio'), index=null, BASE='';
for(const cand of BARRIO?[BARRIO]:['barcelona','la-dreta-de-l-eixample']){
  try{ index=await getJSON(`../data/gold/${cand}/index.json`); BARRIO=cand; BASE=`../data/gold/${cand}/`; break; }catch(e){}
}
if(!index){
  fail(location.protocol==='file:'
    ? T('Has abierto el fichero directamente y el navegador no deja leer los datos.\nEjecuta abrir_visor.bat en la carpeta city3d.','The file was opened directly and the browser blocks reading the data.\nRun abrir_visor.bat in the city3d folder.')
    : T('No encuentro los datos de la ciudad. Prueba a recargar la página.','The city data could not be found. Try reloading the page.'));
  return;
}
let metro=null; try{ metro=await getJSON(BASE+'metro.json'); }catch(e){}
const CITY=!!index.lod2;
const L1=index.lod1?index.lod1.tiles:index.tiles;           // detalle por edificio
const L2=CITY?index.lod2.tiles:[];                           // manzanas (solo ciudad)
if(!index.lod1&&!CITY){ $('warn').textContent='Sin generalizar: ejecuta pipeline/generalizar_barrio.py para un dibujo limpio y rápido.'; $('warn').style.display='block'; }
$('title').removeAttribute('data-en'); $('title').textContent=index.barrio;
const S=index.stats;
function renderHeader(){
  $('stats').innerHTML=T(`${NUM(S.edificios)} edificios · altura mediana ${S.altura_mediana_m} m · máx. ${S.altura_max_m} m · construcción mediana ${S.ano_mediano??'–'}`,
                         `${NUM(S.edificios)} buildings · median height ${S.altura_mediana_m} m · max. ${S.altura_max_m} m · median year built ${S.ano_mediano??'–'}`);
  const src=(T('Fuentes: ','Sources: '))+index.source+(metro?' · '+metro.source:'');   // incluye OpenStreetMap y arbolado si existen
  $('src').textContent=index.source+(metro?' · '+metro.source:''); $('srcm').textContent=src;
}
renderHeader();

/* ================= Escena ================= */
const canvas=$('c');

  float dist=abs(fract(c)-0.5);

  return 1.0-smoothstep(w-aa,w+aa,dist);

attribute vec3 aCol; attribute float aPart; uniform float uFlat;

${MASK}
#endif
varying vec3 vN; varying vec3 vW; varying vec3 vCol; varying float vPart;
void main(){
#ifdef USE_MASK

#endif
  vec3 p=position; p.y=mix(p.y,0.5,uFlat);
  vec4 w=modelMatrix*vec4(p,1.0); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); vCol=aCol; vPart=aPart;
  gl_Position=projectionMatrix*viewMatrix*w; }`;
const bldFS=`
uniform vec3 ink; uniform vec3 L; uniform float sp; uniform float sel; uniform float ghost; uniform vec3 selCol; uniform float hatchOn;
varying vec3 vN; varying vec3 vW; varying vec3 vCol; varying float vPart;
${NOISE}
${HATCH}

  vec3 n=normalize(vN);
  if(ghost>0.5){ if(n.y<0.5) discard; gl_FragColor=vec4(vCol*0.97,0.6); return; }

  vec2 uv = a.y>max(a.x,a.z) ? vW.xz : (a.x>a.z ? vW.zy : vW.xy);

  if(hatchOn>0.5 && t<0.42) col=mix(col,ink,hatch(uv,0.785,0.11,sp)*0.5);

const baseMat=new THREE.ShaderMaterial({

    cRoad:{value:new THREE.Color(0xd6c9ab)},cPed:{value:new THREE.Color(0xf2e8d2)},cVia:{value:new THREE.Color(0xc5b698)},cPark:{value:new THREE.Color(0xdcd0b5)},cAzul:{value:new THREE.Color(0xaebcc4)},cVerdeZ:{value:new THREE.Color(0xbac6a0)},cDum:{value:new THREE.Color(0xd8bf8c)},cGreen:{value:new THREE.Color(0xc9d29a)},

  vertexShader:`attribute float aKind; varying float vK; varying vec3 vW; void main(){ vK=aKind; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,

    varying float vK; varying vec3 vW; ${NOISE} ${HATCH}
    void main(){
      float k=floor(vK+0.5);
      vec3 col = k<1.5?cRoad : k<2.5?cPed : k<3.5?cGreen : k<4.5?cWater : k<5.5?cSand : k<6.5?cVia : k<8.5?cPark : k<9.5?cAzul : k<10.5?cVerdeZ : cDum;   // 7 parking, 8 calle, 9 Àrea Blava, 10 Verda, 11 carga

const earthMat=new THREE.ShaderMaterial({
  uniforms:{ink:{value:INK},sp:U.sp},

const treeMat=new THREE.ShaderMaterial({

      vN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*normalize(position)); vV=fract(sin(dot(instanceMatrix[3].xz,vec2(12.9898,78.233)))*43758.5453);

  fragmentShader:`uniform vec3 ink,L,c; uniform float sp,hatchOn; varying vec3 vN; varying vec3 vW; varying float vV; ${NOISE} ${HATCH}
    void main(){ float t=0.22+0.78*max(dot(normalize(vN),normalize(L)),0.0);
      vec3 col=c*(0.9+0.2*vV)*(t>0.72?1.0:(t>0.42?0.88:0.74));
      if(hatchOn>0.5&&t<0.42) col=mix(col,ink,hatch(vW.xy,0.785,0.11,sp)*0.45);

  extensions:{derivatives:true}});
const treeOutMat=new THREE.ShaderMaterial({
  uniforms:{c:{value:INK},w:U.w,wind:U.wind},
  vertexShader:`uniform float w; uniform vec4 wind; void main(){ vec4 p=modelMatrix*instanceMatrix*vec4(position,1.0); float ph=fract(sin(dot(instanceMatrix[3].xz,vec2(12.9898,78.233)))*43758.5453); p.xz+=wind.xy*wind.z*(0.55+0.45*sin(wind.w*1.9+ph*6.2832))*(0.3+0.7*clamp(position.y*0.5+0.5,0.,1.));
      vec3 n=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*normalize(position)); p.xyz+=n*w*0.75; gl_Position=projectionMatrix*viewMatrix*p; }`,

      railMat=new THREE.LineBasicMaterial({color:0x5a3d26}), plazaMat=new THREE.LineBasicMaterial({color:0xfbf6e8,transparent:true,opacity:0.85});

const poleGeo=new THREE.CylinderGeometry(0.1,0.12,3.4,5).translate(0,1.7,0), headGeo=new THREE.BoxGeometry(0.36,1.0,0.36).translate(0.12,3.0,0);

const poleMat=semMat(0x3b2e22), headMat=semMat(0x1f1712);
function buildSuelo(d){
  const g=new THREE.Group();
  const lines=(arr,mat)=>{ if(!arr.length) return; const bg=new THREE.BufferGeometry(); bg.setAttribute('position',new THREE.BufferAttribute(arr,3)); bg.computeBoundingSphere(); freeAfterUpload(bg); g.add(new THREE.LineSegments(bg,mat)); };
  lines(d.marca,markMat); lines(d.bici,bikeMat); lines(d.rail,railMat); lines(d.plaza,plazaMat);
  if(d.zebra.length){ const zg=new THREE.BufferGeometry(); zg.setAttribute('position',new THREE.BufferAttribute(d.zebra,3)); zg.setAttribute('aU',new THREE.BufferAttribute(d.zebraU,1)); zg.computeBoundingSphere(); freeAfterUpload(zg); g.add(new THREE.Mesh(zg,zebraMat)); }
  if(d.apos.length){ const ag=new THREE.BufferGeometry(); ag.setAttribute('position',new THREE.BufferAttribute(d.apos,3)); ag.setAttribute('aKind',new THREE.BufferAttribute(d.akind,1)); ag.computeBoundingSphere(); freeAfterUpload(ag); g.add(new THREE.Mesh(ag,baseMat)); }
  const ns=d.sem.length/3;
  if(ns){
    const pole=new THREE.InstancedMesh(poleGeo,poleMat,ns), head=new THREE.InstancedMesh(headGeo,headMat,ns), m=new THREE.Matrix4();
    for(let i=0;i<ns;i++){ m.makeRotationY(d.sem[i*3+2]); m.setPosition(d.sem[i*3],0.18,d.sem[i*3+1]); pole.setMatrixAt(i,m); }
    head.instanceMatrix=pole.instanceMatrix;
    for(const im of [pole,head]){ im.frustumCulled=false; g.add(im); }
  }
  const n=d.trees.length/3;
  if(n){
    const crown=new THREE.InstancedMesh(treeGeo,treeMat,n), trunk=new THREE.InstancedMesh(trunkGeo,trunkMat,n), m=new THREE.Matrix4();
    let cx=0,cz=0;
    for(let i=0;i<n;i++){ const x=d.trees[i*3], z=d.trees[i*3+1], r=d.trees[i*3+2]; cx+=x; cz+=z;
      m.makeScale(r,r*0.9,r).setPosition(x,r*0.9+2.2,z); crown.setMatrixAt(i,m);
      m.makeScale(1,2.4+r*0.2,1).setPosition(x,0,z); trunk.setMatrixAt(i,m); }
    const out=new THREE.InstancedMesh(treeGeo,treeOutMat,n); out.instanceMatrix=crown.instanceMatrix;
    for(const im of [crown,trunk,out]){ im.frustumCulled=false; g.add(im); }
  }
  return g;
}

const col=hex=>[((hex>>16)&255)/255,((hex>>8)&255)/255,(hex&255)/255];
const kx=()=>-ST.L[0]/ST.L[1], kz=()=>-ST.L[2]/ST.L[1];

  const m=e.data;

    const r=await fetch(m.url,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status+' '+m.url);
    const tile=await r.json();
    if(m.kind==='base'){                       // mapa base: polígonos planos por capa
      const KIND={calzada:1,peatonal:2,verde:3,agua:4,playa:5}, Y={calzada:0.22,peatonal:0.18,verde:0.14,agua:0.1,playa:0.1};

          const v=p.o.map(q=>new THREE.Vector2(q[0],q[1])), hs=(p.i||[]).map(h=>h.map(q=>new THREE.Vector2(q[0],q[1])));

      const seg=(lists,y)=>{ const o=[]; for(const l of (lists||[])) for(let i=0;i+3<l.length;i+=2) o.push(l[i],y,l[i+1],l[i+2],y,l[i+3]); return new Float32Array(o); };

      const zeb=[], zu=[], y=0.35;
      for(const p of (tile.pasos||[])){ const dx=p[2]-p[0], dz=p[3]-p[1], L=Math.hypot(dx,dz); if(L<0.5) continue;
        const nx=-dz/L*2, nz=dx/L*2;           // medio ancho del paso: 2 m a cada lado del eje
        zeb.push(p[0]-nx,y,p[1]-nz, p[2]-nx,y,p[3]-nz, p[2]+nx,y,p[3]+nz,  p[0]-nx,y,p[1]-nz, p[2]+nx,y,p[3]+nz, p[0]+nx,y,p[1]+nz); zu.push(0,L,L,0,L,0); }
      for(const q of (tile.cebras||[])){ zeb.push(q[0],y,q[1],q[2],y,q[3],q[4],y,q[5], q[0],y,q[1],q[4],y,q[5],q[6],y,q[7]); zu.push(.25,.25,.25,.25,.25,.25); }   // formato antiguo
      const apos=[], akind=[], KA={via:6,aparcamiento:7,calle:8,azul:9,verde:10,dum:11};
      for(const [capa,polys] of Object.entries(tile.areas||{})){ const k=KA[capa]||7;

      const trees=new Float32Array((tile.arboles||[]).flat()), sem=new Float32Array((tile.semaforos||[]).flat()), plz=new Float32Array((tile.plazas||[]).flat());
      const Z=new Float32Array(zeb), ZU=new Float32Array(zu), AP=new Float32Array(apos), AK=new Float32Array(akind);

const NW=Math.max(2,Math.min(4,(navigator.hardwareConcurrency||4)-1));
const workerURL=URL.createObjectURL(new Blob([WORKER_SRC],{type:'application/javascript'}));
const jobs=new Map(); let jobId=0;
const workers=[];
for(let i=0;i<NW;i++){
  const w=new Worker(workerURL);
  w.onmessage=e=>{ const j=jobs.get(e.data.id); if(!j) return; jobs.delete(e.data.id); e.data.ok?j.res(e.data):j.rej(new Error(e.data.error)); };
  w.onerror=e=>{ mostrarError(new Error('Fallo en un worker: '+(e.message||'¿sin conexión para cargar Three.js?'))); };
  w.postMessage({type:'init',style:STYLE}); workers.push(w);
}
function work(file,idBase,opts){
  return new Promise((res,rej)=>{ const id=++jobId; jobs.set(id,{res,rej});
    workers[id%NW].postMessage({id,url:new URL(BASE+file,location.href).href,idBase,...opts}); });
}

/* ================= Construcción de mallas ================= */
// Una vez subida a la GPU, la copia de la geometría en JavaScript no hace falta (la selección se hace en la GPU)
function disposeArray(){ this.array=null; }

const parts=[]; let nextId=0;
function makeSet(d,mat,outMat,withEdges){
  if(!d) return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(d.pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(d.nor,3));
  g.setAttribute('aCol',new THREE.BufferAttribute(d.col,3)); g.setAttribute('aPart',new THREE.BufferAttribute(d.part,1));
  g.setAttribute('aTile',new THREE.BufferAttribute(d.tile,2)); g.computeBoundingSphere();
  const hg=new THREE.BufferGeometry();
  hg.setAttribute('position',new THREE.BufferAttribute(d.hPos,3)); hg.setAttribute('normal',new THREE.BufferAttribute(d.hNor,3));
  hg.setAttribute('aTile',new THREE.BufferAttribute(d.hTile,2)); hg.setIndex(new THREE.BufferAttribute(d.hIdx,1)); hg.boundingSphere=g.boundingSphere;
  const group=new THREE.Group();
  const mesh=new THREE.Mesh(g,mat); mesh.layers.enable(L_PICK); group.add(mesh);
  group.add(new THREE.Mesh(hg,outMat));
  if(withEdges&&d.edges){ const eg=new THREE.BufferGeometry(); eg.setAttribute('position',new THREE.BufferAttribute(d.edges,3)); group.add(new THREE.LineSegments(eg,edgeMat)); }
  group.userData.mesh=mesh;
  group.traverse(o=>{ if(o.geometry) freeAfterUpload(o.geometry); });
  return group;
}
function disposeGroup(gr){ if(!gr) return; gr.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); scene.remove(gr); }

/* ---------- Nivel 2 (manzanas): se carga entero al inicio; también genera las sombras ---------- */
const far=[], shadowChunks=[];
paso('cargar manzanas');
let done=0;
const totalInit=CITY?L2.length:0;
if(CITY){
  await Promise.all(L2.map(t=>{ const idBase=nextId; nextId+=t.count;
    return work(t.file,idBase,{edges:false,shadows:true}).then(d=>{
      d.info.forEach((x,k)=>parts[idBase+k]=x);
      const gr=makeSet(d.city,mat2,out2,false); if(gr){ scene.add(gr); far.push(gr); }
      shadowChunks.push(d.shadow); done++;

    }); }));

/* ---------- Mapa base (calles, verdes, agua, playas) ---------- */
const baseTiles=(index.base&&index.base.tiles)||[];
const baseGroupPending=[], curbLines=[];
const curbMat=new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:0.42});
if(baseTiles.length){
  paso('cargar mapa base'); let nb=0;
  await Promise.all(baseTiles.map(t=>work(t.file,0,{kind:'base'}).then(d=>{
    if(d.base&&d.base.pos.length){
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(d.base.pos,3)); g.setAttribute('aKind',new THREE.BufferAttribute(d.base.kind,1));
      g.computeBoundingSphere(); freeAfterUpload(g); baseGroupPending.push(new THREE.Mesh(g,baseMat));
      if(d.base.curb&&d.base.curb.length){ const cg=new THREE.BufferGeometry(); cg.setAttribute('position',new THREE.BufferAttribute(d.base.curb,3)); cg.computeBoundingSphere(); freeAfterUpload(cg);
        curbLines.push(new THREE.LineSegments(cg,curbMat)); }

/* ---------- Nivel 1 (detalle por edificio): por demanda ---------- */
const tiles=L1.map((t,k)=>{
  const bb=t.bbox||[-1e5,-1e5,1e5,1e5];
  return {k,t,state:'none',group:null,under:null,ids:null,lastSeen:0,
    box:new THREE.Box3(new THREE.Vector3(bb[0],-(t.dmax||30)-1,bb[1]),new THREE.Vector3(bb[2],(t.hmax||100)+1,bb[3]))};
});
if(!CITY){                                   // un solo barrio: se carga todo de una vez, con sombras
  paso('cargar teselas');
  await Promise.all(tiles.map(tl=>loadTile(tl,true)));
}
function loadTile(tl,shadows){
  tl.state='loading'; inflight++; STATS.req++; const tReq=performance.now();
  const idBase=nextId; nextId+=tl.t.count;
  return work(tl.t.file,idBase,{edges:true,shadows:!!shadows}).then(d=>{
    inflight--;
    d.info.forEach((x,k)=>parts[idBase+k]=x); tl.ids=[idBase,tl.t.count];
    tl.group=makeSet(d.city,mat1,outCity,true); tl.under=makeSet(d.under,matBase,out1,true);
    if(tl.group){ tl.group.visible=false; scene.add(tl.group); }
    if(tl.under){ tl.under.visible=false; scene.add(tl.under); }
    if(shadows) shadowChunks.push(d.shadow);
    tl.state='ready'; readyCount++; dirty=true; STATS.ok++; STATS.lat.push(performance.now()-tReq);
  }).catch(err=>{ inflight--; tl.state='error'; STATS.err++; if(STATS.errors.length<20) STATS.errors.push(tl.t.file+': '+(err&&err.message||err)); console.warn(err); });
}
function evict(tl){
  STATS.evicted++;
  disposeGroup(tl.group); disposeGroup(tl.under); tl.group=tl.under=null;
  if(tl.ids){ for(let i=0;i<tl.ids[1];i++) delete parts[tl.ids[0]+i]; tl.ids=null; }
  tl.state='none'; tl.revealed=false; readyCount--;
}

/* ---------- Zócalo, calles, tierra, límites de barrio ---------- */
paso('zócalo y calles');
const outlines=index.outlines||[index.outline];
const allPts=outlines.flat();
const xs=allPts.map(p=>p[0]), zs=allPts.map(p=>p[1]);
const minX=Math.min(...xs)-150, maxX=Math.max(...xs)+150, minZ=Math.min(...zs)-150, maxZ=Math.max(...zs)+150;
const shapes=outlines.map(o=>new THREE.Shape(o.map(p=>new THREE.Vector2(p[0],-p[1]))));
function slab(shape,depth){ const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false}); g.rotateX(-Math.PI/2); g.translate(0,-depth,0); return g; }
function hullOf(geo){
  let h=new THREE.BufferGeometry(); h.setAttribute('position',geo.getAttribute('position').clone());
  h=THREE.BufferGeometryUtils.mergeVertices(h,0.02); h.computeVertexNormals(); return h;
}
const ground=new THREE.Group(), earth=new THREE.Group(); scene.add(ground); scene.add(earth); earth.visible=false;
for(const m of baseGroupPending) ground.add(m);

  ground.add(new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(-Math.PI/2).translate(0,0.05,0),streetMat));

/* ---------- Sombras horneadas (vista cenital, una sola vez) ---------- */
paso('sombras');
function bakeShadows(){
  let n=0; for(const c of shadowChunks) n+=c.length; if(!n) return;
  const all=new Float32Array(n); let o=0; for(const c of shadowChunks){ all.set(c,o); o+=c.length; }
  const W=maxX-minX, D=maxZ-minZ, maxT=Math.min(renderer.capabilities.maxTextureSize,CITY?(SIN_GPU?2048:MOVIL||LIGERO?4096:8192):2048);   // 8192² = 256 MB de GPU; en el móvil (o si ya se perdió el dibujo), 64 MB
  const rw=W>=D?maxT:Math.round(maxT*W/D), rh=W>=D?Math.round(maxT*D/W):maxT;
  const rt=new THREE.WebGLRenderTarget(rw,rh); rt.texture.minFilter=THREE.LinearFilter;
  const sScene=new THREE.Scene(), g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(all,3));
  sScene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x000000,side:THREE.DoubleSide})));
  const sCam=new THREE.OrthographicCamera(-W/2,W/2,D/2,-D/2,1,4000);
  sCam.up.set(0,0,-1); sCam.position.set((minX+maxX)/2,2000,(minZ+maxZ)/2); sCam.lookAt((minX+maxX)/2,0,(minZ+maxZ)/2);
  renderer.setRenderTarget(rt); renderer.setClearColor(0xffffff,1); renderer.clear(); renderer.render(sScene,sCam);
  renderer.setRenderTarget(null); renderer.setClearColor(PAPER,1); g.dispose();
  streetMat.uniforms.shadow.value=rt.texture; streetMat.uniforms.box.value.set(minX,minZ,W,D); streetMat.uniforms.hasShadow.value=1;
  shadowChunks.length=0;
}
bakeShadows();

    const tubeMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{c:{value:col},L:{value:LDIR}},
      vertexShader:`varying vec3 vN; void main(){ vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0); }`,
      fragmentShader:`uniform vec3 c; uniform vec3 L; varying vec3 vN; void main(){ float d=max(dot(normalize(vN),normalize(L)),0.0); gl_FragColor=vec4(c*(0.8+0.2*step(0.35,d)),0.28); }`});
    const lineTrains=[];
    for(const path of l.paths){
      if(path.length<2) continue;
      const curve=new THREE.CatmullRomCurve3(path.map(p=>new THREE.Vector3(p[0],-l.depth_m,p[1])),false,'centripetal');
      const tg=new THREE.TubeGeometry(curve,Math.max(24,path.length*3),CITY?10:7,8,false);
      const tube=new THREE.Mesh(tg,tubeMat); tube.renderOrder=3; metroGroup.add(tube);

      metroGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(Math.max(24,path.length*3))),new THREE.LineBasicMaterial({color:col.clone().multiplyScalar(0.6)})));
      const len=curve.getLength(), ntr=Math.max(2,Math.round(len/1500));
      for(let k=0;k<ntr;k++) lineTrains.push({curve,len,u:k/ntr,dir:k%2?1:-1});
    }
    if(lineTrains.length){                    // todos los trenes de la línea en una sola llamada de dibujo
      const inst=new THREE.InstancedMesh(new THREE.BoxGeometry(14,14,80),new THREE.MeshBasicMaterial({color:col}),lineTrains.length);
      inst.frustumCulled=false; metroGroup.add(inst); trainSets.push({inst,items:lineTrains});
    }
    legend.push(`<div><i style="background:${l.color||'#888'}"></i>${l.name} · ~${l.depth_m} m</div>`);
  }
  metro.legendHTML=legend.join('');
  const stMat=new THREE.MeshBasicMaterial({color:0xf6ead0});
  for(const s of metro.stations){
    const d=Math.max(...s.lines.map(n=>depthOf[n]||20));
    const g1=new THREE.CylinderGeometry(CITY?22:16,CITY?22:16,14,16).translate(s.x,-d,s.z), g2=new THREE.CylinderGeometry(4,4,d,6).translate(s.x,-d/2,s.z);

    stationLabels.push({el,p:new THREE.Vector3(s.x,-d+16,s.z)});
  }
  if(stationGeos.length){                     // todas las estaciones en una sola malla (+ su contorno)
    const sg=THREE.BufferGeometryUtils.mergeBufferGeometries(stationGeos,false);
    metroGroup.add(new THREE.Mesh(sg,stMat)); metroGroup.add(new THREE.Mesh(hullOf(sg),out1));
  }
}

{

const pickRT=new THREE.WebGLRenderTarget(1,1);
const pickMat=new THREE.ShaderMaterial({
  uniforms:{uMask:U.uMask,uMaskSize:U.uMaskSize},
  vertexShader:`attribute float aPart; ${MASK} varying float vP;
    void main(){ if(aTile.x>=0.0 && masked()){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; } vP=aPart; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying float vP; void main(){ float id=vP+1.0;
    gl_FragColor=vec4(mod(id,256.0)/255.0, mod(floor(id/256.0),256.0)/255.0, floor(id/65536.0)/255.0, 1.0); }`,
  side:THREE.DoubleSide});
const pixel=new Uint8Array(4), glc=renderer.getContext(), isGL2=renderer.capabilities.isWebGL2;
let pbo=null, pickSync=null, pickCb=null, pickT0=0, pickMs=0;
function pickAsync(cx,cy,cb){
  if(pickSync) return;
  pickT0=performance.now();
  cam.setViewOffset(innerWidth,innerHeight,Math.floor(cx),Math.floor(cy),1,1);
  cam.layers.set(L_PICK); scene.overrideMaterial=pickMat;
  renderer.setRenderTarget(pickRT); renderer.setClearColor(0x000000,1); renderer.clear(); renderer.render(scene,cam);
  if(isGL2){
    if(!pbo){ pbo=glc.createBuffer(); glc.bindBuffer(glc.PIXEL_PACK_BUFFER,pbo); glc.bufferData(glc.PIXEL_PACK_BUFFER,4,glc.STREAM_READ); }
    glc.bindBuffer(glc.PIXEL_PACK_BUFFER,pbo); glc.readPixels(0,0,1,1,glc.RGBA,glc.UNSIGNED_BYTE,0); glc.bindBuffer(glc.PIXEL_PACK_BUFFER,null);
    pickSync=glc.fenceSync(glc.SYNC_GPU_COMMANDS_COMPLETE,0); glc.flush(); pickCb=cb;
  } else { renderer.readRenderTargetPixels(pickRT,0,0,1,1,pixel); }
  renderer.setRenderTarget(null); scene.overrideMaterial=null; cam.clearViewOffset(); cam.layers.set(L_MAIN); renderer.setClearColor(PAPER,1);
  if(!isGL2){ pickMs=performance.now()-pickT0; cb(pixel[0]+pixel[1]*256+pixel[2]*65536-1); }
}
function pickPoll(){
  if(!pickSync) return;
  const st=glc.clientWaitSync(pickSync,0,0);
  if(st===glc.ALREADY_SIGNALED||st===glc.CONDITION_SATISFIED){
    glc.deleteSync(pickSync); pickSync=null;
    glc.bindBuffer(glc.PIXEL_PACK_BUFFER,pbo); glc.getBufferSubData(glc.PIXEL_PACK_BUFFER,0,pixel); glc.bindBuffer(glc.PIXEL_PACK_BUFFER,null);
    pickMs=performance.now()-pickT0; if(REC.on) REC.picks.push(pickMs);
    const cb=pickCb; pickCb=null; cb(pixel[0]+pixel[1]*256+pixel[2]*65536-1);
  }
}

function frameTo(points,fill){
  const px=points.map(p=>p[0]), pz=points.map(p=>p[1]);
  const cx=(Math.min(...px)+Math.max(...px))/2, cz=(Math.min(...pz)+Math.max(...pz))/2;
  const off=cam.position.clone().sub(controls.target); if(off.lengthSq()<1) off.copy(DIR).multiplyScalar(CAMDIST);
  off.setLength(CAMDIST);
  controls.target.set(cx,0,cz); cam.position.copy(controls.target).add(off); cam.lookAt(controls.target); cam.updateMatrixWorld();
  const r=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion), up=new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion);
  let hw=1,hh=1; const v=new THREE.Vector3();
  for(const p of points) for(const y of [-30,80]){ v.set(p[0]-cx,y,p[1]-cz); hw=Math.max(hw,Math.abs(v.dot(r))); hh=Math.max(hh,Math.abs(v.dot(up))); }
  const a=innerWidth/innerHeight; cam.zoom=Math.min(H*a*(fill||0.9)/hw, H*0.78*(fill||0.9)/0.9/hh); cam.updateProjectionMatrix();
  lastMove=performance.now(); dirty=true;
}

/* ================= Nivel de detalle: qué teselas cargar y mostrar ================= */
const frustum=new THREE.Frustum(), projM=new THREE.Matrix4();
let lodTimer=0;
function updateLOD(now){
  if(now-lodTimer<120) return; lodTimer=now;
  const near=!CITY || mppNow()<NEAR_MPP;
  cam.updateMatrixWorld(); projM.multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse); frustum.setFromProjectionMatrix(projM);
  const want=[]; let maskChanged=false, revealBudget=2, pendingReveal=false;
  for(const tl of tiles){
    const vis=frustum.intersectsBox(tl.box);
    if(vis) tl.lastSeen=now;
    let show=near&&vis&&tl.state==='ready';
    if(show&&!tl.revealed){ if(revealBudget>0){ revealBudget--; tl.revealed=true; } else { show=false; pendingReveal=true; } }
    if(tl.group&&tl.group.visible!==show){ tl.group.visible=show; dirty=true; }
    if(tl.under){ const su=show&&mode==='under'; if(tl.under.visible!==su){ tl.under.visible=su; dirty=true; } }
    if(CITY&&tl.t.i!==undefined){
      const idx=(tl.t.j*GRID[0]+tl.t.i)*4, mv=show?255:0;
      if(maskData[idx]!==mv){ maskData[idx]=mv; maskChanged=true; }
    }
    if(near&&vis&&tl.state==='none') want.push(tl);
  }
  if(maskChanged){ maskTex.needsUpdate=true; dirty=true; }
  if(pendingReveal) lodTimer=0;
  lastWant=want.length; lastPendingReveal=pendingReveal;     // quedan teselas por mostrar: seguir en el próximo fotograma
  // Pedir primero lo más cercano al centro de la vista
  const c=controls.target;
  want.sort((a,b)=>a.box.distanceToPoint(c)-b.box.distanceToPoint(c));
  for(const tl of want){ if(inflight>=MAX_INFLIGHT) break; loadTile(tl,false); }
  // Liberar memoria: lo que lleva más tiempo sin verse
  if(readyCount>MAX_READY){
    const old=tiles.filter(t=>t.state==='ready'&&!(t.group&&t.group.visible)).sort((a,b)=>a.lastSeen-b.lastSeen);
    for(const tl of old.slice(0,readyCount-MAX_READY)) evict(tl);
  }
  barrioLines.visible=mode==='city'&&mppNow()>0.6;
  updateSuelo(mode==='city'&&mppNow()<DETAIL_MPP);
  $('stream').textContent=CITY?`detalle: ${readyCount} teselas en memoria${inflight?` · cargando ${inflight}`:''} · ${near?'de cerca':'vista general'} · ${mppNow().toFixed(2)} m/px · suelo ${suelo.filter(b=>b.state==='ready').length} ok, ${suelo.filter(b=>b.state==='loading').length} cargando${suelo.some(b=>b.state==='error')?` · ${suelo.filter(b=>b.state==='error').length} con error: ${sueloErr}`:''}${mppNow()>=DETAIL_MPP?' (acerca hasta <1.3 para ver el suelo)':''}`:'';
}

async function pickSample(n){

  if(window.CITY3D&&window.CITY3D.listo) await Promise.race([window.CITY3D.listo,sleep(Math.max(0,15000-(performance.now()-t)))]);
  await sleep(400);                                                                                          // un respiro para el primer dibujo con todo
  // «estoy aquí»: qué navegador y qué gráfica tiene cada equipo que lo abre (para entender fallos de un solo equipo)
  informar('visita',{carga_s:+((performance.now()-T0)/1000).toFixed(1),movil:!!MOVIL,ligero:LIGERO,sinGpu:SIN_GPU,pixeles:renderer.getPixelRatio()});
  // ritmo real durante 10 s tras cargar: si va a tirones (menos de ~12 fotogramas por segundo), informe
  { let n=0, lentos=0, prev=performance.now(); const fin=prev+10000;
    const mide=t=>{ const d=t-prev; prev=t; n++; if(d>85) lentos++; if(t<fin) requestAnimationFrame(mide); else if(n>20&&lentos/n>0.5) informar('va a tirones',{fotogramas:n,lentos}); };
    requestAnimationFrame(mide); }
  if(SIN_GPU){ const d=document.createElement('div'); d.className='card';
    d.innerHTML=T('<b>El navegador está dibujando el mapa sin la tarjeta gráfica</b>, por eso va lento. Actívala: en Chrome o Edge, <i>Configuración → Sistema → «Usar aceleración por hardware cuando esté disponible»</i>, y reinicia el navegador.',
      '<b>Your browser is drawing the map without the graphics card</b>, which is why it is slow. Turn it on: in Chrome or Edge, <i>Settings → System → “Use hardware acceleration when available”</i>, then restart the browser.')
      +' <button style="margin-left:6px">✕</button>';
    d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(560px,92vw);padding:10px 14px;z-index:60;font:15px/1.35 "EB Garamond",serif';
    d.querySelector('button').onclick=()=>d.remove(); document.body.appendChild(d); }
  if(VUELTA){ controls.target.fromArray(VUELTA.t); cam.position.fromArray(VUELTA.p); cam.zoom=VUELTA.z; cam.lookAt(controls.target); cam.updateProjectionMatrix(); controls.update(); }
  dirty=true; window.__visorListo=true; $('load').style.opacity=0; setTimeout(()=>$('load').style.display='none',500);
  // Entrada: un momento la ciudad entera y luego vuelo a pie de calle (Passeig de Gràcia con Gran Via), donde ya se ven
  // coches, buses, bicis y gente. Así nadie ve una ciudad quieta al llegar. Si la persona toca el mapa antes, manda ella.
  if(INTRO){
    let tocado=false; const parar=()=>{ tocado=true; if(fly&&fly.intro) fly=null; };
    for(const ev of ['pointerdown','wheel','keydown']) window.addEventListener(ev,parar,{once:true,capture:true});
    await sleep(900);
    if(!tocado&&!bench){ flyTo(INTRO,cam.zoom*mppNow()/0.3,3.2); fly.intro=true; }
  }
})();

  movil:MOVIL, renderLegend, LIVE_BTN:$('bLive'), origin:index.origin, intro:INTRO};
{ const s=document.createElement('script'); s.src='vivo.js?v='+Date.now(); s.onerror=()=>console.warn('vivo.js no disponible'); document.body.appendChild(s); }
tick();
