# Compactación nocturna del histórico de Lumiose Planner (ver pipeline/compactar_nube.py).
# Cada noche junta las capturas sueltas que el Worker guarda en R2 en días, semanas, meses, años y décadas,
# y deja en el repositorio un resumen (data/gold/barcelona/historico.json). Ese commit diario también evita que
# GitHub pare la tarea programada por falta de actividad.
# Secretos del repositorio (Settings → Secrets and variables → Actions): R2_ACCESS_KEY_ID y R2_SECRET_ACCESS_KEY.
name: Compactar histórico

on:
  schedule:
    - cron: "30 2 * * *"        # 03:30 en Barcelona en invierno, 04:30 en verano
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba: escribe en prueba/historico/ y no borra nada"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: compactar
  cancel-in-progress: false

jobs:
  compactar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "pyarrow>=14" "boto3>=1.34"

      - name: Compactar
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            python pipeline/compactar_nube.py --prueba --resumen ""
          else
            python pipeline/compactar_nube.py
          fi

      - name: Guardar el resumen en el repositorio
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/gold/barcelona/historico.json ] || exit 0
          git add data/gold/barcelona/historico.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Histórico: resumen de la compactación nocturna"
          git pull --rebase --quiet && git push
