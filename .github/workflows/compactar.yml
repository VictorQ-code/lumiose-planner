# Compactación nocturna del histórico de Lumiose Planner (ver pipeline/compactar_nube.py).
# Cada noche junta las capturas sueltas que el Worker guarda en R2 en días, semanas, meses, años y décadas,
# deja en el repositorio un resumen (data/gold/barcelona/historico.json) y rehace el horario del tranvía
# (data/gold/barcelona/vivo/tranvia.json). Ese commit diario también evita que
# GitHub pare la tarea programada por falta de actividad.
# Secretos del repositorio (Settings → Secrets and variables → Actions): R2_ACCESS_KEY_ID y R2_SECRET_ACCESS_KEY.
name: Compactar histórico

on:
  schedule:
    # GitHub retrasa o se salta tareas programadas cuando va cargado (sobre todo en :00 y :30), por eso
    # minutos poco comunes y una segunda hora de respaldo. Repetir es seguro: solo cierra periodos terminados.
    - cron: "17 2 * * *"        # 03:17 en Barcelona en invierno, 04:17 en verano
    - cron: "47 5 * * *"        # respaldo: 06:47 en invierno, 07:47 en verano
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba: escribe en prueba/historico/ y no borra nada"
        type: boolean
        default: true
      hoy:
        description: "Solo en modo prueba: fingir que hoy es esta fecha (AAAA-MM-DD), para compactar días aún abiertos"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: compactar
  cancel-in-progress: false

jobs:
  compactar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "pyarrow>=14" "boto3>=1.34" "requests>=2.31"

      - name: Compactar
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONIOENCODING: utf-8
          HOY: ${{ inputs.hoy }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            python pipeline/compactar_nube.py --prueba --resumen "" ${HOY:+--hoy "$HOY"}
          else
            python pipeline/compactar_nube.py
          fi

      # TRAM publica unas 4-5 semanas de horario por delante: se rehace cada noche para que nunca se acabe
      - name: Horario del tranvía
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python pipeline/tranvia.py

      - name: Guardar el resumen y el horario del tranvía en el repositorio
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/gold/barcelona/historico.json data/gold/barcelona/vivo/tranvia.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Histórico y horario del tranvía: actualización nocturna"
          git pull --rebase --quiet && git push
